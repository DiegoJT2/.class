<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Cookies + IndexedDB</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #333; border-bottom: 2px solid #333; padding-bottom: 8px; }
        h2 { color: #555; margin-top: 30px; }
        input[type="text"], input[type="number"] { padding: 6px 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 7px 14px; margin-left: 8px; border: none; border-radius: 4px; cursor: pointer; background: #4a90d9; color: white; }
        button:hover { background: #357abd; }
        button.danger { background: #e05555; }
        button.danger:hover { background: #c03030; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 9px 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #5ba85b; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .seccion { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
        #bienvenida { font-size: 1.1em; font-weight: bold; color: #333; margin-bottom: 10px; }
        label { display: inline-block; width: 60px; }
        .campo { margin: 8px 0; }
    </style>
</head>
<body>

<h1>Ejercicio 2 — Cookies + IndexedDB</h1>

<!-- ==================== PARTE 1: Cookies ==================== -->
<div class="seccion">
    <h2>Bienvenida (Cookies)</h2>
    <div id="bienvenida"></div>
    <button class="danger" onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<!-- ==================== PARTE 2: IndexedDB ==================== -->
<div class="seccion">
    <h2>Registro de Alumnos (IndexedDB)</h2>

    <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Nombre del alumno" required>
    </div>
    <div class="campo">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" min="16" max="99" placeholder="Edad" required>
    </div>
    <button onclick="guardarAlumno()">Guardar alumno</button>

    <table style="margin-top: 20px;">
        <thead>
            <tr><th>ID</th><th>Nombre</th><th>Edad</th></tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>
</div>

<script>
    var db;

    // ── Abrir / crear la base de datos ──────────────────────────────
    var request = window.indexedDB.open('colegio', 1);

    request.onerror = function(event) {
        console.log("Error al abrir la base de datos");
    };

    request.onsuccess = function(event) {
        db = event.target.result;
        mostrarAlumnos();
    };

    request.onupgradeneeded = function(event) {
        var db = event.target.result;
        db.createObjectStore('alumnos', { autoIncrement: true });
    };


    // ── Cookies: leer una cookie por nombre ─────────────────────────
    function leerCookie(nombre) {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.startsWith(nombre + '=')) {
                return cookie.substring(nombre.length + 1);
            }
        }
        return null;
    }

    // ── Cookies: comprobar bienvenida al cargar ─────────────────────
    window.onload = function() {
        var usuario = leerCookie('usuario');
        if (usuario === null) {
            var nombre = prompt('¿Cuál es tu nombre?');
            if (nombre && nombre.trim() !== '') {
                document.cookie = 'usuario=' + nombre.trim() + '; max-age=3600; path=/';
                usuario = nombre.trim();
            } else {
                usuario = 'Invitado';
            }
        }
        document.getElementById('bienvenida').textContent = 'Bienvenido, ' + usuario;
    };

    // ── Cookies: cerrar sesión ──────────────────────────────────────
    function cerrarSesion() {
        document.cookie = 'usuario=; max-age=0; path=/';
        location.reload();
    }


    // ── IndexedDB: guardar alumno ───────────────────────────────────
    function guardarAlumno() {
        var nombre = document.getElementById('nombre').value.trim();
        var edad = document.getElementById('edad').value;

        if (nombre === '' || edad === '') {
            alert('Rellena todos los campos');
            return;
        }

        var transaction = db.transaction(['alumnos'], 'readwrite');
        var store = transaction.objectStore('alumnos');
        var addRequest = store.add({ nombre: nombre, edad: parseInt(edad) });

        addRequest.onsuccess = function() {
            alert('Alumno guardado');
            document.getElementById('nombre').value = '';
            document.getElementById('edad').value = '';
            mostrarAlumnos();
        };
        addRequest.onerror = function() {
            console.log('Error al guardar el alumno');
        };
    }

    // ── IndexedDB: mostrar alumnos con cursor ───────────────────────
    function mostrarAlumnos() {
        var cuerpo = document.getElementById('cuerpoTabla');
        cuerpo.innerHTML = '';

        var transaction = db.transaction(['alumnos'], 'readonly');
        var store = transaction.objectStore('alumnos');
        var cursorRequest = store.openCursor();

        cursorRequest.onsuccess = function(event) {
            var cursor = event.target.result;
            if (cursor) {
                var row = cuerpo.insertRow();
                row.insertCell(0).textContent = cursor.key;
                row.insertCell(1).textContent = cursor.value.nombre;
                row.insertCell(2).textContent = cursor.value.edad;
                cursor.continue();
            }
        };
        cursorRequest.onerror = function() {
            console.log('Error al mostrar los alumnos');
        };
    }
</script>

</body>
</html>
