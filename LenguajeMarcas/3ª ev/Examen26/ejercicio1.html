<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - SessionStorage + IndexedDB</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 860px; margin: 30px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #333; border-bottom: 2px solid #333; padding-bottom: 8px; }
        h2 { color: #555; margin-top: 30px; }
        input[type="text"] { padding: 6px 10px; width: 260px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 7px 14px; margin-left: 8px; border: none; border-radius: 4px; cursor: pointer; background: #4a90d9; color: white; }
        button:hover { background: #357abd; }
        button.verde { background: #5ba85b; }
        button.verde:hover { background: #3d8a3d; }
        button.danger { background: #e05555; }
        button.danger:hover { background: #c03030; }
        ul { list-style: none; padding: 0; }
        ul li { background: white; padding: 8px 14px; margin: 5px 0; border-radius: 4px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 12px; }
        th, td { padding: 9px 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #5ba85b; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .seccion { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
        .vacio { color: #999; font-style: italic; }
        .acciones { display: flex; gap: 6px; }
    </style>
</head>
<body>

<h1>Ejercicio 1 — SessionStorage + IndexedDB</h1>

<!-- ==================== SessionStorage: lista de productos ==================== -->
<div class="seccion">
    <h2>Productos (SessionStorage)</h2>

    <input type="text" id="producto" placeholder="Nombre del producto">
    <button onclick="añadirProducto()">Añadir producto</button>
    <button class="danger" onclick="vaciarProductos()">Vaciar lista</button>

    <ul id="listaProductos" style="margin-top: 15px;"></ul>
</div>

<!-- ==================== IndexedDB: favoritos ==================== -->
<div class="seccion">
    <h2>Favoritos guardados (IndexedDB)</h2>
    <table>
        <thead>
            <tr><th>ID</th><th>Producto</th></tr>
        </thead>
        <tbody id="cuerpoFavoritos"></tbody>
    </table>
</div>

<script>
    var db;

    // ── Abrir la BD en versión 2 para forzar la creación del store correcto ──
    var request = window.indexedDB.open('tienda', 2);

    request.onerror = function(event) {
        console.log("Error al abrir la base de datos");
    };

    request.onsuccess = function(event) {
        db = event.target.result;
        mostrarProductos();
        mostrarFavoritos();
    };

    request.onupgradeneeded = function(event) {
        var db = event.target.result;
        // Eliminar el store antiguo si existe (por si venía de la versión anterior)
        if (db.objectStoreNames.contains('pedidos')) {
            db.deleteObjectStore('pedidos');
        }
        // Crear el store correcto si aún no existe
        if (!db.objectStoreNames.contains('favoritos')) {
            db.createObjectStore('favoritos', { autoIncrement: true });
        }
    };


    // ── SessionStorage: añadir producto ────────────────────────────
    function añadirProducto() {
        var nombre = document.getElementById('producto').value.trim();
        if (nombre === '') {
            alert('Escribe el nombre del producto');
            return;
        }
        if (sessionStorage.getItem(nombre) !== null) {
            alert('Ese producto ya está en la lista');
            return;
        }
        sessionStorage.setItem(nombre, 'pendiente');
        document.getElementById('producto').value = '';
        mostrarProductos();
    }

    // ── SessionStorage: mostrar productos ──────────────────────────
    function mostrarProductos() {
        var lista = document.getElementById('listaProductos');
        lista.innerHTML = '';

        if (sessionStorage.length === 0) {
            lista.innerHTML = '<li class="vacio">No hay productos en la lista</li>';
            return;
        }

        for (var i = 0; i < sessionStorage.length; i++) {
            var nombre = sessionStorage.key(i);
            var li = document.createElement('li');
            li.textContent = nombre;

            var acciones = document.createElement('div');
            acciones.className = 'acciones';

            var btnFav = document.createElement('button');
            btnFav.textContent = '★ Añadir a favoritos';
            btnFav.className = 'verde';
            btnFav.onclick = (function(n) {
                return function() { añadirFavorito(n); };
            })(nombre);

            var btnQuitar = document.createElement('button');
            btnQuitar.textContent = 'Quitar';
            btnQuitar.className = 'danger';
            btnQuitar.onclick = (function(n) {
                return function() { quitarProducto(n); };
            })(nombre);

            acciones.appendChild(btnFav);
            acciones.appendChild(btnQuitar);
            li.appendChild(acciones);
            lista.appendChild(li);
        }
    }

    // ── SessionStorage: quitar producto ────────────────────────────
    function quitarProducto(nombre) {
        sessionStorage.removeItem(nombre);
        mostrarProductos();
    }

    // ── SessionStorage: vaciar todo ─────────────────────────────────
    function vaciarProductos() {
        sessionStorage.clear();
        mostrarProductos();
    }


    // ── IndexedDB: guardar favorito ─────────────────────────────────
    function añadirFavorito(nombre) {
        var transaction = db.transaction(['favoritos'], 'readwrite');
        var store = transaction.objectStore('favoritos');
        var addRequest = store.add({ producto: nombre });

        addRequest.onsuccess = function() {
            mostrarFavoritos();
        };
        addRequest.onerror = function() {
            console.log('Error al guardar el favorito');
        };
    }

    // ── IndexedDB: mostrar favoritos con cursor ─────────────────────
    function mostrarFavoritos() {
        var cuerpo = document.getElementById('cuerpoFavoritos');
        cuerpo.innerHTML = '';

        var transaction = db.transaction(['favoritos'], 'readonly');
        var store = transaction.objectStore('favoritos');
        var cursorRequest = store.openCursor();

        cursorRequest.onsuccess = function(event) {
            var cursor = event.target.result;
            if (cursor) {
                var row = cuerpo.insertRow();
                row.insertCell(0).textContent = cursor.key;
                row.insertCell(1).textContent = cursor.value.producto;
                cursor.continue();
            }
        };
        cursorRequest.onerror = function() {
            console.log('Error al mostrar los favoritos');
        };
    }
</script>

</body>
</html>
